name: pipeline

on: [push]

permissions: {}

jobs:
  code:
    permissions:
      contents: read
      security-events: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/code-workflow.yml@master
    with:
      lint_command: "make lint"
      test_command: "make test"
      sec_command: "make sec"
      sarif_file: "sec.sarif"
      sarif_category: "python"

  badges:
    needs: [code]
    if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master

  call-docker-image-workflow:
    needs: [code]
    permissions:
      contents: write # GitHub Release
      security-events: write # upload the Grype SARIF to the Security tab
    uses: psyb0t/reusable-github-workflows/.github/workflows/docker-image-workflow.yml@master

    with:
      repository_name: psyb0t/stealthy-auto-browse
      target_platforms: "linux/amd64,linux/arm64"
      scan_severity: "high" # camoufox bundles Go 1.19 with unfixed criticals
      # Grype always finds those unfixable upstream criticals — report them to
      # the Security tab but don't fail the run (so the clawhub job below can
      # depend on this workflow succeeding).
      scan_fail_build: false

    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  # Publish the skills under .agents/skills/ to ClawHub. Tag pushes ONLY, and
  # only after the Docker image build/push + GitHub release have succeeded
  # (needs the docker-image workflow, which does both).
  publish-to-clawhub:
    needs: [call-docker-image-workflow]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/clawhub-publish.yml@master

    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}

  publish-to-mcp-registry:
    needs: [call-docker-image-workflow]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write
      contents: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/mcp-registry-publish.yml@master
