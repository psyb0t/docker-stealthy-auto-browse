name: pipeline

on:
  # Every branch and every tag: the mirror needs to see all of them, and the
  # jobs below carry their own ref guards.
  push:
  # Staggered per repository. The Wayback Machine is rate-limited and one save
  # takes ~110s, so a shared cron would have every repo throttling the rest.
  schedule:
    - cron: "56 1 5 * *"
  workflow_dispatch:

jobs:
  badges:
    if: github.event_name != 'schedule' && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master

  call-docker-image-workflow:
    if: github.event_name != 'schedule'
    permissions:
      contents: write # GitHub Release
      security-events: write # upload the Grype SARIF to the Security tab
    uses: psyb0t/reusable-github-workflows/.github/workflows/docker-image-workflow.yml@master

    with:
      repository_name: psyb0t/stealthy-auto-browse
      target_platforms: "linux/amd64,linux/arm64"
      scan_severity: "high" # camoufox bundles Go 1.19 with unfixed criticals
      # Grype always finds those unfixable upstream criticals — report them to
      # the Security tab but don't fail the run (so the clawhub job below can
      # depend on this workflow succeeding).
      scan_fail_build: false

    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  # Publish the skills under .agents/skills/ to ClawHub. Tag pushes ONLY, and
  # only after the Docker image build/push + GitHub release have succeeded
  # (needs the docker-image workflow, which does both).
  publish-to-clawhub:
    needs: [call-docker-image-workflow]
    if: startsWith(github.ref, 'refs/tags/')
    uses: psyb0t/reusable-github-workflows/.github/workflows/clawhub-publish.yml@master

    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}

  publish-to-mcp-registry:
    needs: [call-docker-image-workflow]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write
      contents: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/mcp-registry-publish.yml@master

  # Every branch and every tag, which is why it carries no ref filter: a mirror
  # that only saw the default branch would silently drop the rest.
  mirror:
    if: github.event_name == 'push'
    uses: psyb0t/reusable-github-workflows/.github/workflows/git-mirror.yml@master
    with:
      gitlab_enabled: true
      # Gitee is off: it requires a mobile number bound to the account before
      # any repository can be public, and rather than refusing it creates the
      # repo private, so the mirror runs green while nobody can see it. Turn it
      # back on once the account is verified.
      gitee_enabled: false
    secrets:
      gitlab_token: ${{ secrets.GITLAB_TOKEN }}

  # Runs on the monthly cron, on a manual dispatch, and on a push to the default
  # branch or a tag -- but NOT on every feature-branch push, or a rate-limited
  # archive would be hammered for no benefit.
  archive:
    if: >-
      github.event_name != 'push' ||
      github.ref_name == github.event.repository.default_branch ||
      startsWith(github.ref, 'refs/tags/')
    uses: psyb0t/reusable-github-workflows/.github/workflows/archive.yml@master
    with:
      # Off because no archive.org keys are set on this repo. Outlink capture
      # only works on the authenticated Save Page Now API; on the keyless path
      # the flag is silently ignored, so leaving it on would just log a warning
      # every run. Add wayback_access_key / wayback_secret_key and flip this to
      # true to sweep in every page the README links to.
      capture_outlinks: false
