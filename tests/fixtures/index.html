<!DOCTYPE html>
<html>
<head><title>Test Page</title></head>
<body>
  <!-- Screen info for resolution tests -->
  <div id="screen-info"></div>
  <script>
    document.getElementById("screen-info").textContent = JSON.stringify({
      sw: screen.width,
      sh: screen.height,
      iw: window.innerWidth,
      ih: window.innerHeight
    });
  </script>

  <!-- Form for fill/type/system_type tests -->
  <form id="test-form">
    <input id="name-input" type="text" name="name" placeholder="Name">
    <input id="email-input" type="text" name="email" placeholder="Email">
    <input id="sys-input" type="text" name="sys" placeholder="System typing">
    <button id="submit-btn" type="button">Submit</button>
  </form>

  <!-- Click result area -->
  <div id="click-result"></div>

  <!-- Large click target for coordinate-based click tests (tolerant of offset errors) -->
  <div id="click-target" style="width: 400px; height: 300px; margin: 50px auto; background: #eee; display: flex; align-items: center; justify-content: center; cursor: pointer;">
    Click here
  </div>
  <div id="click-target-result"></div>

  <!-- Keyboard event tracking -->
  <div id="last-key"></div>

  <!-- Loader marker (loaders write here to prove they ran) -->
  <div id="loader-marker"></div>

  <!-- Download link for download tests -->
  <a id="download-link" href="/download.txt" download="download.txt" style="display:block;margin:10px;">Download test file</a>

  <!-- File upload form for upload tests -->
  <form id="upload-form" action="/upload" method="post" enctype="multipart/form-data">
    <input id="file-input" type="file" name="file">
    <button id="upload-btn" type="submit">Upload</button>
  </form>
  <div id="upload-result"></div>
  <div id="dom-list"></div>

  <!-- Virtual-media feedback for camera/microphone integration tests -->
  <section id="media-test">
    <button id="media-start" type="button">Start camera and microphone</button>
    <button id="media-measure" type="button" disabled>Measure virtual media</button>
    <video id="media-preview" autoplay muted playsinline></video>
    <pre id="media-result">not-started</pre>
  </section>

  <!-- Tall spacer for scroll tests -->
  <div id="spacer" style="height: 5000px; background: linear-gradient(white, gray);"></div>
  <div id="bottom-marker">bottom</div>

  <script>
    document.getElementById("submit-btn").addEventListener("click", function() {
      var el = document.createElement("div");
      el.id = "btn-clicked";
      el.textContent = "clicked";
      document.getElementById("click-result").appendChild(el);
    });

    document.getElementById("click-target").addEventListener("click", function() {
      document.getElementById("click-target-result").textContent = "target-clicked";
    });

    document.addEventListener("keydown", function(e) {
      document.getElementById("last-key").textContent = e.key;
    });

    var domList = document.getElementById("dom-list");
    for (var domIndex = 0; domIndex < 25; domIndex += 1) {
      var domListItem = document.createElement("span");
      domListItem.className = "dom-list-item";
      domListItem.textContent = "item-" + domIndex;
      domList.appendChild(domListItem);
    }

    async function measureVirtualMedia() {
      var fixture = window.mediaFixture;
      if (!fixture) {
        throw new Error("Virtual media has not started");
      }

      await new Promise(function(resolve) { setTimeout(resolve, 1500); });
      var canvas = document.createElement("canvas");
      canvas.width = fixture.video.videoWidth;
      canvas.height = fixture.video.videoHeight;
      if (!canvas.width || !canvas.height) {
        throw new Error("Virtual camera produced no frame");
      }
      var context = canvas.getContext("2d");
      context.drawImage(fixture.video, 0, 0);
      var pixels = context.getImageData(0, 0, canvas.width, canvas.height).data;
      var videoSignal = 0;
      for (var index = 0; index < pixels.length; index += 4) {
        videoSignal += pixels[index] + pixels[index + 1] + pixels[index + 2];
      }

      var samples = new Float32Array(fixture.analyser.fftSize);
      fixture.analyser.getFloatTimeDomainData(samples);
      var audioLevel = 0;
      for (var sampleIndex = 0; sampleIndex < samples.length; sampleIndex += 1) {
        audioLevel += Math.abs(samples[sampleIndex]);
      }
      audioLevel /= samples.length;

      var spectrum = new Float32Array(fixture.analyser.frequencyBinCount);
      fixture.analyser.getFloatFrequencyData(spectrum);
      var audioPeakBin = 0;
      for (var binIndex = 1; binIndex < spectrum.length; binIndex += 1) {
        if (spectrum[binIndex] > spectrum[audioPeakBin]) {
          audioPeakBin = binIndex;
        }
      }

      var recorder = new MediaRecorder(new MediaStream([fixture.audioTrack]));
      var chunks = [];
      var stopped = new Promise(function(resolve) {
        recorder.ondataavailable = function(event) { chunks.push(event.data); };
        recorder.onstop = resolve;
      });
      recorder.start(250);
      await new Promise(function(resolve) { setTimeout(resolve, 750); });
      recorder.stop();
      await stopped;

      var recording = new Blob(chunks, { type: recorder.mimeType });
      var decodedAudio = await fixture.audioContext.decodeAudioData(
        await recording.arrayBuffer()
      );
      var recordedSamples = decodedAudio.getChannelData(0);
      var recordedAudioLevel = 0;
      var zeroCrossings = 0;
      for (var recordedIndex = 0; recordedIndex < recordedSamples.length; recordedIndex += 1) {
        var recordedSample = recordedSamples[recordedIndex];
        recordedAudioLevel += Math.abs(recordedSample);
        if (recordedIndex > 0 && recordedSamples[recordedIndex - 1] <= 0 && recordedSample > 0) {
          zeroCrossings += 1;
        }
      }
      recordedAudioLevel /= recordedSamples.length;
      var estimatedFrequency = zeroCrossings * decodedAudio.sampleRate / recordedSamples.length;

      return {
        status: "ok",
        videoWidth: canvas.width,
        videoHeight: canvas.height,
        videoSignal: videoSignal,
        audioLevel: recordedAudioLevel,
        audioPeakBin: Math.round(estimatedFrequency),
        liveAudioLevel: audioLevel,
        audioChunks: chunks.length,
        audioBytes: chunks.reduce(function(total, chunk) { return total + chunk.size; }, 0),
        videoTrackId: fixture.videoTrack.id,
        audioTrackId: fixture.audioTrack.id
      };
    }

    async function writeVirtualMediaMeasurement() {
      var result = document.getElementById("media-result");
      result.textContent = JSON.stringify({ status: "measuring" });
      try {
        result.textContent = JSON.stringify(await measureVirtualMedia());
      } catch (error) {
        result.textContent = JSON.stringify({ status: "error", message: String(error) });
      }
    }

    document.getElementById("media-start").addEventListener("click", async function() {
      var result = document.getElementById("media-result");
      var video = document.getElementById("media-preview");
      result.textContent = JSON.stringify({ status: "starting" });
      try {
        var audioContext = new AudioContext();
        var analyser = audioContext.createAnalyser();
        analyser.fftSize = 2048;
        audioContext.resume().catch(function(error) {
          result.textContent = JSON.stringify({ status: "error", message: String(error) });
        });

        var stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        result.textContent = JSON.stringify({ status: "stream-acquired" });
        var videoTrack = stream.getVideoTracks()[0];
        var audioTrack = stream.getAudioTracks()[0];
        video.srcObject = new MediaStream([videoTrack]);

        var audioSource = audioContext.createMediaStreamSource(new MediaStream([audioTrack]));
        audioSource.connect(analyser);
        analyser.connect(audioContext.destination);

        await video.play();
        result.textContent = JSON.stringify({ status: "preview-playing" });

        window.mediaFixture = {
          video: video,
          videoTrack: videoTrack,
          audioTrack: audioTrack,
          audioContext: audioContext,
          analyser: analyser
        };
        document.getElementById("media-measure").disabled = false;
        await writeVirtualMediaMeasurement();
      } catch (error) {
        result.textContent = JSON.stringify({ status: "error", message: String(error) });
      }
    });

    document.getElementById("media-measure").addEventListener("click", writeVirtualMediaMeasurement);
  </script>
</body>
</html>
