name: Example.com Demo
match:
  domain: example.com
steps:
  # Navigate to the page
  - action: goto
    url: "${url}"
    wait_until: domcontentloaded

  # Replace the heading text, adding a heading when the page has none
  - action: eval
    expression: |
      (() => {
        let heading = document.querySelector('h1');
        if (!heading) {
          heading = document.createElement('h1');
          document.body.prepend(heading);
        }
        heading.textContent = 'Hello from Loader!';
      })()

  # Replace the first paragraph's text, adding a paragraph when the page has none
  - action: eval
    expression: |
      (() => {
        let paragraph = document.querySelector('p');
        if (!paragraph) {
          paragraph = document.createElement('p');
          document.querySelector('h1').after(paragraph);
        }
        paragraph.textContent = 'This page was modified by the example loader.';
      })()

  # Inject a styled banner at the top
  - action: eval
    expression: |
      (() => {
        const banner = document.createElement('div');
        banner.id = 'loader-banner';
        banner.textContent = 'Loader was here';
        banner.style.cssText =
          'background:#2563eb;color:#fff;padding:12px;text-align:center;' +
          'font-size:18px;font-weight:bold;position:fixed;top:0;left:0;' +
          'width:100%;z-index:9999';
        document.body.prepend(banner);
      })()

  # Trigger an alert (auto-accepted by the dialog handler)
  - action: eval
    expression: "alert('Page modified by loader!')"

  # Small pause so the page settles
  - action: sleep
    duration: 0.5
